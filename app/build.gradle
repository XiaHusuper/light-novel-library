plugins { id 'com.android.application' }

android {
    namespace 'com.xiahu.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xiahu.reader'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.8.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
